# ==============================================================================
# Apache2 VirtualHost Configuration for Starehe Girls' Centre (sgc.kkdes.co.ke)
# Ports: 80 (HTTP -> HTTPS redirect), 443 (HTTPS), 2896 (HTTP), 2685 (HTTPS)
# Backend: Docker container listening on http://127.0.0.1:3001
# ==============================================================================

<VirtualHost *:80>
    ServerName __DOMAIN__
    ServerAlias www.__DOMAIN__

    DocumentRoot /var/www/certbot

    # Allow Let's Encrypt ACME HTTP-01 challenges
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory "/var/www/certbot/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/sgc-http-error.log
    CustomLog ${APACHE_LOG_DIR}/sgc-http-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName __DOMAIN__
    ServerAlias www.__DOMAIN__

    SSLEngine on
    SSLCertificateFile __SSL_CERT__
    SSLCertificateKeyFile __SSL_KEY__

    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket support
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3001/$1" [P,L]

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ErrorLog ${APACHE_LOG_DIR}/sgc-https-error.log
    CustomLog ${APACHE_LOG_DIR}/sgc-https-access.log combined
</VirtualHost>
</IfModule>

<VirtualHost *:2896>
    ServerName __DOMAIN__

    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3001/$1" [P,L]

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "2896"

    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog ${APACHE_LOG_DIR}/sgc-2896-error.log
    CustomLog ${APACHE_LOG_DIR}/sgc-2896-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:2685>
    ServerName __DOMAIN__

    SSLEngine on
    SSLCertificateFile __SSL_CERT__
    SSLCertificateKeyFile __SSL_KEY__

    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3001/$1" [P,L]

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "2685"

    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/sgc-2685-error.log
    CustomLog ${APACHE_LOG_DIR}/sgc-2685-access.log combined
</VirtualHost>
</IfModule>
